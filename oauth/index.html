<!DOCTYPE html>
<html lang="en">

<head>
    <title>Authenticator OAuth Redirect</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="../src/css/style.css">
</head>

<body class="bg-light full-height">

    <div class="container"
        style="text-align: center; max-width: 400px; background: var(--surface); padding: 40px; border-radius: 8px; box-shadow: var(--shadow);">
        <!-- Success Check Icon -->
        <svg viewBox="0 0 24 24" width="64" height="64" style="color: #0f9d58; margin-bottom: 20px;">
            <path fill="currentColor"
                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" />
        </svg>

        <h2 style="margin-bottom: 16px;">Signed in successfully!</h2>
        <p class="text-secondary" style="font-size: 1rem;">Shield Authenticator has connected to your cloud drive. You
            can safely close this tab now.</p>

        <button onclick="window.close()" class="btn btn-primary" style="margin-top: 20px;">Close Window</button>
    </div>

</body>

</html>
