<!DOCTYPE html>
<html lang="en">

<head>
  <title>Shield Authenticator</title>
  <link rel="icon" href="src/assets/logo/logo.svg">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="src/css/style.css">
</head>

<body class="bg-light align-center full-height">

  <main class="container">
    <div class="hero-layout">

      <div class="hero-logo">
        <img src="src/assets/logo/logo.svg" alt="Authenticator Logo" />
      </div>

      <div class="hero-content">
        <h1 class="text-primary">Shield Authenticator</h1>
        <h3 class="text-secondary">Two-factor authentication just in your browser</h3>

        <div class="action-group">
          <div class="dropdown">
            <a href="https://chrome.google.com/webstore/detail/authenticator/bhghoamapcdpbohphigoooaddinpkbai"
              class="btn btn-primary">Add to Chrome</a>
            <button class="btn btn-primary dropdown-toggle" id="browser-dropdown-btn" aria-label="More browsers">
              <svg viewBox="0 0 24 24" width="24" height="24">
                <path fill="currentColor" d="M7 10l5 5 5-5z" />
              </svg>
            </button>
            <div class="dropdown-menu" id="browser-dropdown-menu">
              <a href="https://addons.mozilla.org/en-US/firefox/addon/shield-authenticator=external-website"
                class="dropdown-item">Add to Firefox</a>
              <a href="https://microsoftedge.microsoft.com/addons/detail/ocglkepbibnalbgmbachknglpdipeoio"
                class="dropdown-item">Add to Edge</a>
            </div>
          </div>

          <a href="https://github.com/Pro-Bandey/Shield-Authenticator" class="btn btn-outline">Source Code</a>
          <a href="docs/" class="btn btn-outline">Docs</a>
        </div>
      </div>

    </div>
  </main>
  <script src="src/js/index.js"></script>
</body>

</html>
